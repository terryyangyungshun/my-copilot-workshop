<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="簡單的離線待辦清單，使用 localStorage 儲存資料。">
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="header-row">
        <h1 class="title">待辦清單</h1>
        <!-- 深色模式切換按鈕 -->
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式">🌙 深色模式</button>
      </div>

      <div class="input-row">
        <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 或按新增" aria-label="新增待辦" />
        <button id="add-btn" type="button">新增</button>
      </div>

      <!-- 篩選按鈕 -->
      <div class="filters" role="tablist" aria-label="篩選待辦">
        <button class="filter-btn active" data-filter="all" type="button">全部</button>
        <button class="filter-btn" data-filter="active" type="button">未完成</button>
        <button class="filter-btn" data-filter="completed" type="button">已完成</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <div id="empty" class="empty" role="status" aria-live="polite">還沒有任何待辦事項,新增一個吧!</div>

      <footer class="footer">未完成: <span id="remaining">0</span> 項</footer>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
