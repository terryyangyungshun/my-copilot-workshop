<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="簡單的離線待辦清單，使用 localStorage 儲存資料。">
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1 class="title">待辦清單</h1>

      <div class="input-row">
        <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 或按新增" aria-label="新增待辦" />
        <button id="add-btn" type="button">新增</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <div id="empty" class="empty">還沒有任何待辦事項,新增一個吧!</div>

      <footer class="footer">未完成: <span id="remaining">0</span> 項</footer>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
